<svg viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zinviqCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="50%" stopColor="#00A3FF" />
      <stop offset="100%" stopColor="#0070F3" />
    </linearGradient>
    <linearGradient id="zinviqRibbonFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Mark (Z geometric ribbon) -->
  <g transform="translate(10, 0)">
    <path d="M18 20 H82 V34 H38 Z" fill="url(#zinviqCyanGrad)" />
