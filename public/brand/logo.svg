    <path d="M26 66 H82 V80 H18 Z" fill="url(#zinviqCyanGrad)" />
    <circle cx="82" cy="22" r="4.5" fill="#00E5FF" filter="url(#beaconGlow)" />
    <circle cx="82" cy="22" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typographic Wordmark: ZINVIQ -->
  <text x="125" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="0.22em" fill="#0F172A">
